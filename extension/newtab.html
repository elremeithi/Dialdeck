<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Tab</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="ui/newtab.css">
<style id="custom-css"></style>
</head>
<body class="loading">
<div id="bg"></div>
<div id="app">
  <header id="topbar">
    <div id="clock" hidden></div>
    <form id="search" autocomplete="off" role="search">
      <button type="button" id="engine-btn" title="Search engine"></button>
      <input id="q" type="search" placeholder="Search the web or your dials…" aria-label="Search">
    </form>
    <div id="top-actions">
      <button id="btn-layout" class="icon-btn" title="Switch this tab between List and Tiles"></button>
      <button id="btn-sync" class="icon-btn" title="Sync"></button>
      <button id="btn-sidebar" class="icon-btn" title="Recently closed, most visited & bookmarks"></button>
      <button id="btn-settings" class="icon-btn" title="Settings"></button>
    </div>
  </header>
  <nav id="groupbar" aria-label="Groups"></nav>
  <main id="main">
    <div id="lock-screen" hidden></div>
    <div id="grid" class="grid"></div>
    <div id="search-results" hidden></div>
  </main>
</div>
<aside id="sidebar" hidden></aside>
<div id="drawer" hidden></div>
<div id="overlay-root"></div>
<div id="menu" class="ctx" hidden></div>
<div id="toasts"></div>
<input type="file" id="file-pick" hidden>
<script type="module" src="ui/newtab.js"></script>
</body>
</html>
