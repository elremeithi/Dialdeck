# nginx reverse proxy in front of Nextcloud on Unraid — settings DialDeck sync relies on.
#
# Most Nextcloud proxy configs already work. The things that break WebDAV sync are:
#   1. a body-size limit that rejects thumbnail / data uploads       -> client_max_body_size
#   2. gzip turning ETags into weak ETags (W/"...")                   -> gzip off for /remote.php/dav
#   3. rules that only allow GET/POST (limit_except, WAF rules)       -> allow PROPFIND, MKCOL, PUT, DELETE, MOVE, COPY
#   4. a stripped Authorization or If-Match header                    -> proxy_pass passes them by default; don't clear them
#
# Replace cloud.example.com and the upstream address with yours. For SWAG / Nginx Proxy Manager,
# see the notes at the bottom.

server {
    listen 443 ssl;
    http2 on;
    server_name cloud.example.com;

    ssl_certificate     /etc/letsencrypt/live/cloud.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.example.com/privkey.pem;

    # (1) uploads: thumbnails are ~50-200 KB, data.json grows with your dial count; Nextcloud itself wants more
    client_max_body_size 1G;
    proxy_request_buffering off;

    # Nextcloud discovery redirects
    location = /.well-known/carddav { return 301 $scheme://$host/remote.php/dav; }
    location = /.well-known/caldav  { return 301 $scheme://$host/remote.php/dav; }

    # (2) WebDAV: no gzip, so ETags stay strong and If-Match conflict detection is exact
    location ^~ /remote.php/dav {
        gzip off;
        proxy_pass         https://192.168.1.10:444;   # your Unraid Nextcloud container (http:// if it serves plain HTTP)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering    off;
        # (3) do NOT add "limit_except GET POST { deny all; }" here.
    }

    location / {
        proxy_pass         https://192.168.1.10:444;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Nextcloud's config.php must trust the proxy (usually already done):
#   'trusted_domains'   => ['cloud.example.com'],
#   'trusted_proxies'   => ['IP-OF-YOUR-NGINX'],
#   'overwriteprotocol' => 'https',
#
# SWAG (linuxserver): the stock nextcloud.subdomain.conf works; just make sure your
#   nginx.conf / site-confs don't set gzip_proxied for application/json on /remote.php/dav,
#   and client_max_body_size is ≥ 100M (SWAG default is 0 = unlimited for nextcloud).
#
# Nginx Proxy Manager: Proxy host → Advanced tab → add:
#   client_max_body_size 1G;
#   proxy_request_buffering off;
#   location ^~ /remote.php/dav { gzip off; proxy_pass $forward_scheme://$server:$port; }
#
# Verify everything from any machine with:
#   ./check-webdav.sh https://cloud.example.com/remote.php/dav/files/USERNAME/ USERNAME
